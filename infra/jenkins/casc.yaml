# ---------------------------------------------------------------------------
# Jenkins Configuration as Code (JCasC)
# Everything an engineer would normally click through in "Manage Jenkins" is
# declared here, so a brand-new Jenkins is fully configured on first start.
# ${VAR} values are injected from infra/.env (generated by scripts/bootstrap.sh).
# ---------------------------------------------------------------------------
jenkins:
  systemMessage: "TaskFlow CI/CD - configured as code (infra/jenkins/casc.yaml)"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          name: "TaskFlow Admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: "REGISTRY"
            value: "localhost:5001"
          - key: "TEAM_EMAIL"
            value: "devops-team@taskflow.local"

unclassified:
  location:
    url: "http://localhost:8080/"
    adminAddress: "jenkins@taskflow.local"
  mailer:
    smtpHost: "mailpit"
    smtpPort: "1025"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonarqube-token"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              description: "SonarQube analysis token (generated by scripts/sonar-setup.sh)"
              secret: "${SONAR_TOKEN}"
          - string:
              scope: GLOBAL
              id: "staging-jwt-secret"
              description: "JWT signing secret - staging"
              secret: "${STAGING_JWT_SECRET}"
          - string:
              scope: GLOBAL
              id: "production-jwt-secret"
              description: "JWT signing secret - production"
              secret: "${PROD_JWT_SECRET}"
          - string:
              scope: GLOBAL
              id: "chaos-token"
              description: "Token for the incident-simulation (fault injection) endpoint"
              secret: "${CHAOS_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: "grafana-admin"
              description: "Grafana API user (deployment annotations)"
              username: "admin"
              password: "${GRAFANA_ADMIN_PASSWORD}"
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              description: "GitHub user + personal access token (clone private repo, push release tags)"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"

jobs:
  - script: >
      pipelineJob('taskflow-pipeline') {
        displayName('TaskFlow CI/CD Pipeline')
        description('Build -> Test -> Code Quality -> Security -> Deploy (staging) -> Release (production) -> Monitoring. Pipeline definition lives in the Jenkinsfile of the Git repository.')
        logRotator { numToKeep(30) }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${GIT_REPO_URL}')
                  if ('${GITHUB_USER}' != 'none') { credentials('github-credentials') }
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
