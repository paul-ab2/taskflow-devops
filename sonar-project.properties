# ---------------------------------------------------------------------------
# SonarQube analysis configuration (Code Quality stage)
# The quality gate itself ("TaskFlow Gate") is created as code by
# scripts/sonar-setup.sh - see docs/PIPELINE.md for the thresholds and rationale.
# ---------------------------------------------------------------------------
sonar.projectKey=taskflow-api
sonar.projectName=TaskFlow API
# Overridden by Jenkins with -Dsonar.projectVersion=<app version> so every build is a point on the trend graph
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# What to analyse
sonar.sources=src,public
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Exclusions
sonar.exclusions=**/node_modules/**,coverage/**,reports/**
# The browser client is exercised by smoke tests, not unit tests; the bootstrap file only wires the process
sonar.coverage.exclusions=public/**,src/server.js
# Test code is intentionally repetitive (arrange/act/assert), so it is excluded from duplication checks
sonar.cpd.exclusions=tests/**

# Reports produced by earlier pipeline steps
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=reports/eslint.json

# Make the scanner wait for the quality gate result and fail the stage if the gate fails
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
